<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="stripes" width="90" height="90" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#0a0a0a"/>
      <rect width="45" height="90" fill="#f5c518"/>
    </pattern>
  </defs>

  <!-- full-bleed hazard stripe background -->
  <rect width="512" height="512" fill="url(#stripes)"/>

  <!-- black inset square -->
  <rect x="86" y="86" width="340" height="340" rx="56" fill="#0a0a0a" stroke="#000000" stroke-width="4"/>

  <!-- bold L glyph, drawn as a solid path (no font dependency) -->
  <path d="
    M 196 156
    L 244 156
    L 244 316
    L 336 316
    L 336 356
    L 196 356
    Z
  " fill="#f5c518"/>
</svg>
